name: Fetch PoE Data

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League Name (optional, empty = all leagues)'
        required: false
        default: ''
  schedule:
    # JST 05:17 毎日 (UTC 20:17)。:00 を避けて cron 遅延のキュー軽減。
    - cron: '17 20 * * *'

concurrency:
  group: fetch-poe-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/fetch-poe-data/go.mod
          cache-dependency-path: scripts/fetch-poe-data/go.mod

      - name: Fetch character data
        working-directory: scripts/fetch-poe-data
        env:
          # 主経路: POESESSID (旧 character-window API)
          POE_ACCOUNT_NAME: ${{ secrets.POE_ACCOUNT_NAME }}
          POESESSID: ${{ secrets.POESESSID }}
          # フォールバック経路: OAuth2。どちらの Secret が設定されていても
          # POESESSID が失敗した場合のみ OAuth2 が使われる。
          POE_CLIENT_ID: ${{ secrets.POE_CLIENT_ID }}
          POE_REFRESH_TOKEN: ${{ secrets.POE_REFRESH_TOKEN }}
          POE_LEAGUE: ${{ inputs.league }}
        run: |
          ARGS="fetch --output-dir=../../content"
          if [ -n "$POE_LEAGUE" ]; then
            ARGS="$ARGS --league=$POE_LEAGUE"
          fi
          # 資格情報はすべて環境変数から読まれる(argv に出さない)
          go run . $ARGS

      - name: Commit updated data
        if: success()
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: update PoE data"
          file_pattern: "content/**/*.json"

      - name: Notify on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## PoE data fetch failed"
            echo ""
            echo "Both the POESESSID method and the OAuth2 fallback failed. Most likely causes:"
            echo "1. POESESSID rejected (common on the new account system) and OAuth2 refresh token expired or not set -> run 'go run . auth --client-id=<id>' locally and update the POE_REFRESH_TOKEN secret (tokens expire after 7 days at most)"
            echo "2. POE_CLIENT_ID not set -> set the secret"
            echo "3. GGG rate limit -> retry later"
            echo ""
            echo "Run log: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
