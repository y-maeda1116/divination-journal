name: Fetch PoE Data

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League Name (optional, empty = all leagues)'
        required: false
        default: ''
  schedule:
    # JST 05:17 毎日 (UTC 20:17)。:00 を避けて cron 遅延のキュー軽減。
    - cron: '17 20 * * *'

concurrency:
  group: fetch-poe-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/fetch-poe-data/go.mod

      - name: Fetch character data
        working-directory: scripts/fetch-poe-data
        env:
          POE_ACCOUNT: ${{ secrets.POE_ACCOUNT_NAME }}
          POESESSID: ${{ secrets.POESESSID }}
          POE_LEAGUE: ${{ inputs.league }}
        run: |
          ARGS="--account=$POE_ACCOUNT --poesessid=$POESESSID --output-dir=../../content"
          if [ -n "$POE_LEAGUE" ]; then
            ARGS="$ARGS --league=$POE_LEAGUE"
          fi
          go run . $ARGS

      - name: Commit updated data
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update PoE data"
          file_pattern: "content/**/*.json"

      - name: Notify on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## PoE data fetch failed"
            echo ""
            echo "Most likely causes:"
            echo "1. POESESSID expired or not set -> update the POESESSID secret"
            echo "2. POE_ACCOUNT_NAME not set -> set the secret"
            echo "3. GGG IP block / rate limit (403) -> retry later"
            echo ""
            echo "Run log: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
