name: Debug legacy XP fields

# 一時的な調査用 workflow。旧 character-window API の生レスポンスに
# experience フィールドが存在するかを Go クライアント経由で確認する
# (curl は Cloudflare の TLS 指紋判定で 403 になるため Go を使う)。
# 確認後にブランチごと削除する。secret は env 経由で渡し、ログに出さない。

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scripts/fetch-poe-data/go.mod
          cache-dependency-path: scripts/fetch-poe-data/go.mod

      - name: Dump raw get-characters response
        working-directory: scripts/fetch-poe-data
        env:
          POE_ACCOUNT_NAME: ${{ secrets.POE_ACCOUNT_NAME }}
          POESESSID: ${{ secrets.POESESSID }}
        run: go run ./cmd/debugxp
